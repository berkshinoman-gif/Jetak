<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جيتك تع خذني</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:5}.brand{font-size:30px;font-weight:900}.sub{color:#d1d5db}.cedar{font-size:34px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.restaurant,.item{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.restaurant{cursor:pointer}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.price{font-weight:800}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#111827;color:#fff}.light{background:#eef2f7}.danger{background:#fee2e2;color:#991b1b}input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);z-index:8}.tabs button{border:0;background:white;padding:12px}.tabs b{display:block}.space{height:70px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.msg{padding:10px;border-radius:10px;background:#f3f4f6}.total{font-size:21px;font-weight:900}.small{color:#6b7280;font-size:13px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="cedar">🌲 🚗 🏍️</div><div class="brand">جيتك تع خذني</div><div class="sub">توصيل بيروت وعاليه</div></header>
<main>
<section id="auth" class="card">
<h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="الإيميل"><input id="password" type="password" placeholder="الباسورد"><button class="btn primary" onclick="login()">تسجيل الدخول</button>
<hr><h3>حساب جديد</h3><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف"><select id="role"><option value="customer">زبون</option><option value="restaurant">مطعم</option><option value="driver">شوفير</option></select><button class="btn light" onclick="signup()">إنشاء حساب</button><p id="authMsg" class="small"></p>
</section>
<section id="app" class="hidden">
<div id="home" class="card"><h2>المطاعم</h2><p class="small">اختار مطعم لتشوف المنيو.</p><div id="restaurants">جاري التحميل...</div></div>
<div id="menu" class="card hidden"><button class="btn light" onclick="show('home')">← المطاعم</button><h2 id="menuTitle"></h2><div id="items"></div></div>
<div id="cart" class="card hidden"><h2>السلة</h2><div id="cartItems"></div><p>المجموع: <span class="total" id="cartTotal">0</span></p><input id="address" placeholder="عنوان التوصيل"><input id="orderPhone" placeholder="رقم الهاتف"><button class="btn primary" onclick="placeOrder()">إرسال الطلب — Wish Money</button><p class="small">رقم Wish Money: 81809157</p><p id="orderMsg" class="small"></p></div>
<div id="orders" class="card hidden"><h2>طلباتي</h2><div id="myOrders">جاري التحميل...</div></div>
<div id="account" class="card hidden"><h2>حسابي</h2><div id="profileBox"></div><button class="btn light" onclick="logout()">تسجيل الخروج</button></div>
</section><div class="space"></div></main>
<nav id="tabs" class="tabs hidden"><button onclick="show('home')">🏠<b>الرئيسية</b></button><button onclick="show('cart')">🛒<b>السلة</b></button><button onclick="show('account')">👤<b>حسابي</b></button></nav>
<script>
const URL='https://hhgupyjnkotmvyhvkhiw.supabase.co',KEY='sb_publishable_Vvb_iWLhPec4YblmEssG0w_rdKgTaSx';const db=supabase.createClient(URL,KEY);let user=null,currentRestaurant=null,cart=[];
const $=id=>document.getElementById(id);
async function login(){const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').textContent='الإيميل أو الباسورد غير صحيح.';return}user=data.user;await start()}
async function signup(){const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim(),phone=$('phone').value.trim(),role=$('role').value;if(!email||!password||!name||!phone){$('authMsg').textContent='عبّي الاسم والهاتف والإيميل والباسورد.';return}const {data,error}=await db.auth.signUp({email,password});if(error){$('authMsg').textContent=error.message;return}if(data.user){const p=await db.from('profiles').insert({id:data.user.id,full_name:name,phone,role});if(p.error){$('authMsg').textContent='تم إنشاء الحساب لكن تعذر حفظ البيانات.';return} $('authMsg').textContent='تم إنشاء الحساب. إذا طلب تأكيد الإيميل، أكّده ثم سجّل الدخول.'}}
async function start(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('tabs').classList.remove('hidden');await loadRestaurants();await loadProfile();show('home')}
function show(id){['home','menu','cart','orders','account'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='cart')renderCart();if(id==='orders')loadOrders();}
async function loadRestaurants(){const r=await db.from('restaurants').select('id,name,address').eq('is_active',true).order('id');const box=$('restaurants');if(r.error){box.textContent='تعذر تحميل المطاعم.';return}box.innerHTML=r.data.map(x=>`<div class="restaurant" onclick="openMenu(${x.id})"><b>${x.name}</b><br><span class="small">${x.address||'بيروت / عاليه'}</span></div>`).join('')||'لا توجد مطاعم حالياً.'}
async function openMenu(id){const r=await db.from('restaurants').select('id,name').eq('id',id).single();const m=await db.from('menu_items').select('id,name,description,price').eq('restaurant_id',id).eq('is_available',true).order('id');if(r.error||m.error){alert('تعذر تحميل المنيو');return}currentRestaurant=r.data;$('menuTitle').textContent=currentRestaurant.name;$('items').innerHTML=m.data.map(x=>`<div class="item"><div><b>${x.name}</b><div class="small">${x.description||''}</div><div class="price">${Number(x.price).toLocaleString('en-US')} ل.ل.</div></div><button class="btn primary" onclick='addToCart(${JSON.stringify(x).replace(/'/g,"&#39;")})'>أضف</button></div>`).join('')||'المنيو غير متوفر حالياً.';show('menu')}
function addToCart(x){if(!currentRestaurant)return;const e=cart.find(a=>a.id===x.id);if(e)e.quantity++;else cart.push({...x,quantity:1,restaurant_id:currentRestaurant.id});renderCart();alert('تمت إضافة الصنف إلى السلة')}
function renderCart(){const box=$('cartItems');if(!cart.length){box.textContent='السلة فارغة.';$('cartTotal').textContent='0';return}box.innerHTML=cart.map((x,i)=>`<div class="row"><span>${x.name} × ${x.quantity}</span><span>${(x.price*x.quantity).toLocaleString('en-US')} ل.ل. <button class="btn danger" onclick="removeCart(${i})">حذف</button></span></div>`).join('');$('cartTotal').textContent=cart.reduce((s,x)=>s+x.price*x.quantity,0).toLocaleString('en-US')+' ل.ل.'}
function removeCart(i){cart.splice(i,1);renderCart()}
async function placeOrder(){if(!user){$('orderMsg').textContent='يجب تسجيل الدخول أولاً.';return}if(!cart.length){$('orderMsg').textContent='السلة فارغة.';return}const address=$('address').value.trim(),phone=$('orderPhone').value.trim();if(!address||!phone){$('orderMsg').textContent='اكتب عنوان التوصيل ورقم الهاتف.';return}const restaurantId=cart[0].restaurant_id;if(cart.some(x=>x.restaurant_id!==restaurantId)){ $('orderMsg').textContent='كل طلب يجب أن يكون من مطعم واحد.';return}const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);const o=await db.from('orders').insert({customer_id:user.id,restaurant_id:restaurantId,status:'pending',total,delivery_address:address,customer_phone:phone}).select('id').single();if(o.error){$('orderMsg').textContent='تعذر إرسال الطلب. تأكد من تسجيل الدخول.';return}const rows=cart.map(x=>({order_id:o.data.id,menu_item_id:x.id,item_name:x.name,quantity:x.quantity,unit_price:x.price}));const oi=await db.from('order_items').insert(rows);if(oi.error){$('orderMsg').textContent='تم إنشاء الطلب لكن تعذر حفظ تفاصيل الأصناف.';return}cart=[];renderCart();$('orderMsg').textContent='تم إرسال طلبك بنجاح إلى جيتك.'}
async function loadOrders(){if(!user)return;const r=await db.from('orders').select('id,status,total,created_at,restaurant_id').eq('customer_id',user.id).order('created_at',{ascending:false});$('myOrders').innerHTML=r.error?'تعذر تحميل الطلبات.':(r.data.length?r.data.map(x=>`<div class="row"><span>طلب #${x.id}<br><span class="small">${new Date(x.created_at).toLocaleString('ar-LB')}</span></span><b>${x.status}<br>${Number(x.total).toLocaleString('en-US')} ل.ل.</b></div>`).join(''):'لا توجد طلبات بعد.')}
async function loadProfile(){const p=await db.from('profiles').select('full_name,phone,role').eq('id',user.id).single();$('profileBox').innerHTML=p.data?`<p><b>الاسم:</b> ${p.data.full_name||''}</p><p><b>الهاتف:</b> ${p.data.phone||''}</p><p><b>الدور:</b> ${p.data.role||''}</p>`:'لا توجد بيانات.'}
async function logout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;await start()}})
</script></body></html>
